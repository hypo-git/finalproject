spring.application.name=finalproject

# MS SQL Server Settings
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=finalproject_system;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=LOGO
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Envers Configuration for SQL Server
spring.jpa.properties.org.hibernate.envers.revision_type_field_name=revtype
# MOD with field change tracking
spring.jpa.properties.org.hibernate.envers.global_with_modified_flag=true


#to stop it from doing endles calls!
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=false


# JWT Configuration
jwt.secret=7d307f90a9574661b6f22de7f89a2ffd
jwt.expiration=86400000

#FOR DEV
server.address=0.0.0.0
#local network
cookie.secure=false
server.port=9090